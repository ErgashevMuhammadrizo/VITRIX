# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.5
  "@babel/core@<7.29.6": ">=7.29.6 <8"
  "browserslist@<4.28.7": ">=4.28.7 <5"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0 <3"
  "fast-uri@<3.1.9": ">=3.1.9 <4"
  "source-map-js@<1.2.2": ">=1.2.2 <2"
  "sharp@<0.35.5": "0.35.5"
  "brace-expansion@<2": "^1.1.21"
  "brace-expansion@>=2 <5.0.12": "^5.0.12"
  "esbuild@<0.28.1": "^0.28.1"
  "fflate@>=0.7.0 <0.7.5": "^0.7.5"
  "image-size@<2.0.3": "^2.0.3"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "minimatch@>=7 <11.0.1": "^11.0.1"
  "react-server-dom-webpack@>=19.2.0 <19.2.8": "19.2.8"
  "satori@<0.33.5": "^0.33.5"
  "undici@>=7 <7.30.1": "^7.30.1"
  "vite@>=8 <8.1.6": "^8.1.6"
  "ws@>=8 <8.21.0": "^8.21.0"
  "zod@<4.6.6": "4.6.6"
