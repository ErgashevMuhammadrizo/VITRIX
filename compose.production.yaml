# Use with compose.yaml; see docs/DEPLOYMENT.md. Only the TLS proxy is public.
services:
  backend:
    environment:
      DJANGO_SECURE_COOKIES: "1"
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    environment:
      VITRIX_DOMAIN: ${VITRIX_DOMAIN:?Set your domain in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
